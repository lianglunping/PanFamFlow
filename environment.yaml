name: panfamflow-engine
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - snakemake=9.25.1
  - conda>=25
  - mamba>=2
  # PanFamFlow CLI runtime. The engine verification imports the application,
  # so an environment that can run Snakemake but not the CLI is rejected.
  - openpyxl>=3.1,<4
  - pandas>=2.2,<3
  - pydantic>=2.11,<3
  - pyyaml>=6,<7
  - rich>=13,<15
  - typer>=0.16,<1
