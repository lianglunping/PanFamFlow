name: Publish immutable DESeq2 runtime

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "containers/expression-de/Dockerfile"
      - ".github/workflows/publish-expression-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: panfamflow-expression-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the amd64 runtime
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: containers/expression-de
          file: containers/expression-de/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ghcr.io/lianglunping/panfamflow-expression-de:bioc3.23-deseq2-1.52.0
            ghcr.io/lianglunping/panfamflow-expression-de:sha-${{ github.sha }}
          cache-from: type=gha,scope=panfamflow-expression-de-amd64
          cache-to: type=gha,mode=max,scope=panfamflow-expression-de-amd64

      - name: Record the immutable registry reference
        run: |
          set -euo pipefail
          printf '%s\n' \
            "docker://ghcr.io/lianglunping/panfamflow-expression-de@${{ steps.publish.outputs.digest }}" \
            | tee expression-de-image-reference.txt

      - name: Upload digest receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expression-de-image-reference-${{ github.sha }}
          path: expression-de-image-reference.txt
          if-no-files-found: error
          retention-days: 90
