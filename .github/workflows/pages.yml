name: Deploy PanFamFlow tutorial

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/index.html"
      - "docs/ANALYSIS_COVERAGE.tsv"
      - "docs/ANALYSIS_COVERAGE.zh-CN.md"
      - "docs/EXTERNAL_EVIDENCE_IMPORTS.zh-CN.md"
      - "docs/TEMPLATE_EQUIVALENCE_AUDIT.zh-CN.md"
      - "docs/TEMPLATE_FIGURE_EQUIVALENCE.tsv"
      - "docs/TUTORIAL_CONTENT_MATRIX.tsv"
      - "docs/TUTORIAL_BEGINNER_LANGUAGE.tsv"
      - "docs/TUTORIAL_BEGINNER_LANGUAGE_AUDIT.zh-CN.md"
      - "docs/TUTORIAL_GAP_AUDIT.zh-CN.md"
      - "docs/TUTORIAL_REPOSITORY_INTEGRATION_QA.zh-CN.md"
      - "docs/TUTORIAL_TERMINOLOGY.tsv"
      - "docs/TUTORIAL_TOY_EVIDENCE_SCHEMA.tsv"
      - "scripts/build_pages_site.py"
      - "scripts/check_site_links.py"
      - "README.md"
      - "README.zh-CN.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build minimal static site
        run: |
          set -euo pipefail
          python3 scripts/build_pages_site.py --output _site
          python3 scripts/check_site_links.py --site _site --base-path /PanFamFlow/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
