name: Deploy PanFamFlow tutorial

on:
  push:
    # Temporary exact-branch trigger for pre-merge deployment evidence.
    # Removed by the post-merge cleanup PR after main is verified.
    branches: [main, fix/github-pages-deployment-v0.1.3]
    paths:
      - "site/**"
      - "docs/index.html"
      - "scripts/build_pages_site.py"
      - "scripts/check_site_links.py"
      - "README.md"
      - "README.zh-CN.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build minimal static site
        run: |
          set -euo pipefail
          python3 scripts/build_pages_site.py --output _site
          python3 scripts/check_site_links.py --site _site --base-path /PanFamFlow/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
